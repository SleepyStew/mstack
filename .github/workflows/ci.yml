name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        # macOS ships bash 3.2 and keeps bash at another path.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Windows PowerShell 5.1 and PowerShell 7 write JSON differently.
      - name: Windows PowerShell 5.1
        run: ./tests/test_setup.ps1
        shell: powershell
      - name: PowerShell 7
        if: ${{ !cancelled() }}
        run: ./tests/test_setup.ps1
        shell: pwsh
